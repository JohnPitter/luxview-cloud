[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:postgresql]
command=/usr/lib/postgresql/16/bin/postgres -D /openmu-data/pgdata
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:admin-proxy]
command=/usr/bin/socat TCP-LISTEN:18080,fork,reuseaddr,bind=0.0.0.0 TCP:127.0.0.1:5000
autostart=true
autorestart=true
priority=15
startsecs=2
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:openmu]
command=/opt/openmu-start.sh
directory=/opt/openmu
autostart=true
autorestart=true
priority=20
startsecs=10
startretries=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
environment=DB_HOST="localhost"
