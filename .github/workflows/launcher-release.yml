name: Launcher Release

# Publica o .exe oficial do launcher no GitHub Releases.
# Dispara ao empurrar uma tag "launcher-v*" (ex.: launcher-v1.32).
# A versão da tag é injetada no binário via -ldflags, e o launcher se
# auto-atualiza a partir desta release (engine /api/public/launcher).
on:
  push:
    tags:
      - 'launcher-v*'

permissions:
  contents: write

jobs:
  build:
    name: Build & publish (windows/amd64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: luxview-launcher

    steps:
      - uses: actions/checkout@v5

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}" -replace '^launcher-', ''
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Launcher version: $ver"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: luxview-launcher/go.sum

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: luxview-launcher/frontend/package-lock.json

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

      - name: Build launcher
        env:
          LUXVIEW_BASE_URL: ${{ vars.LUXVIEW_BASE_URL || 'https://luxview.cloud' }}
        run: wails build -platform windows/amd64 -ldflags "-X main.appVersion=${{ steps.ver.outputs.version }} -X main.luxviewBaseURL=$env:LUXVIEW_BASE_URL"

      - name: Sign executable (Authenticode)
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERT_BASE64)) {
            Write-Host "WINDOWS_CERT_BASE64 not set — skipping Authenticode sign"
            exit 0
          }
          $exe = "build/bin/luxview-launcher.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $pfx = Join-Path $env:RUNNER_TEMP "luxview-codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com `
            /f $pfx /p $env:WINDOWS_CERT_PASSWORD /d "LuxView Cloud Games" $exe
          if ($LASTEXITCODE -ne 0) { throw "signtool failed ($LASTEXITCODE)" }
          & $signtool verify /pa $exe
          Remove-Item -Force $pfx -ErrorAction SilentlyContinue

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LuxView Launcher ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: luxview-launcher/build/bin/luxview-launcher.exe
